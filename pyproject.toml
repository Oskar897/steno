[project]
name = "steno"
version = "0.1.0"
description = "Local, private meeting transcription with speaker recognition, built for Claude Code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
# Kept optional so tests and tooling run without heavy audio/ML wheels.
audio = [
    "pyaudiowpatch>=0.2.12; sys_platform == 'win32'",
    "soxr>=0.3",
    "soundfile>=0.12",  # `steno record --keep-audio`
]
asr = [
    "faster-whisper>=1.1",
]
# Speaker recognition (layer 2). Pinned exactly: embedding behaviour (notably its
# sensitivity to segment length) differs between releases, so upgrade deliberately
# and re-run tests/test_speaker_model.py with the model downloaded.
speakers = [
    "sherpa-onnx==2.0.1",
]
# Desktop window (`steno app`): WebView2 via pythonnet on Windows.
app = [
    "pywebview>=5.3",
]
bench = [
    "sherpa-onnx>=1.10",
    "jiwer>=3.0",
    "soundfile>=0.12",
    "psutil>=5.9",
]

[project.scripts]
steno = "steno.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steno"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
