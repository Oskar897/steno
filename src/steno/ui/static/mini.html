<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Steno recording</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/mini.css">
<script src="/static/mini.js" defer></script>
</head>
<body>
<!-- dragging anywhere but on a button moves the window (mini.js + MiniBridge.drag_*) -->
<div class="strip" id="strip" data-state="idle" title="Drag to move">
  <span class="grip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
  <button class="open" id="open" type="button" title="Open Steno" aria-label="Open Steno"><i class="dot"></i></button>
  <span class="time" id="time">00:00</span>
  <span class="bars" id="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  <button class="b" id="pause" type="button" title="Pause" aria-label="Pause">
    <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
    <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg>
  </button>
  <button class="b stop" id="stop" type="button" title="Stop" aria-label="Stop">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
  </button>
  <button class="b hide" id="hide" type="button" title="Hide until the next recording (recording goes on)" aria-label="Hide strip">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
  </button>
</div>
</body>
</html>
