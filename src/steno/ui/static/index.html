<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Steno</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<div class="app">

  <aside class="side" aria-label="Projects">
    <div class="brand"><i class="dot"></i>STENO<span class="dim">LOCAL</span></div>

    <div class="side-label">Projects</div>
    <nav class="plist" id="plist"></nav>
    <div class="side-actions">
      <button class="btn ghost" id="btn-new" type="button">+ New project</button>
      <button class="btn ghost" id="btn-add" type="button">Add existing folder</button>
    </div>
    <nav class="plist" id="inbox-slot"></nav>

    <div class="grow"></div>
    <nav class="plist"><button class="pitem" id="nav-people" type="button"><span class="pname">People</span><span class="pcount" id="people-count"></span></button><button class="pitem" id="nav-settings" type="button"><span class="pname">Settings</span></button></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>

  <main class="main">
    <!-- project view -->
    <section class="view" id="view-project" aria-label="Meetings">
      <header class="top">
        <div class="top-row">
          <h1 id="proj-name"></h1>
          <button class="btn ghost small" id="btn-forget" type="button" title="Forget this project (files stay on disk)">Forget</button>
        </div>
        <div class="rec-row">
          <input class="text" id="rec-title" type="text" placeholder="Meeting" maxlength="80" aria-label="Meeting title" autocomplete="off">
          <button class="btn rec" id="btn-rec" type="button"><i class="dot"></i><span id="btn-rec-label">Record</span></button>
          <button class="btn" id="btn-pause" type="button" hidden>Pause</button>
          <button class="btn solid" id="btn-stop" type="button" hidden>Stop</button>
          <span class="toggles" id="toggles">
            <button class="tgl" id="tgl-mic" type="button" aria-pressed="true">Mic</button>
            <button class="tgl" id="tgl-loop" type="button" aria-pressed="true">System audio</button>
            <button class="tgl" id="tgl-keep" type="button" aria-pressed="false" title="Keep the raw audio in the meeting folder (needed for a final transcript)">Keep audio</button>
          </span>
        </div>
        <div class="strip" id="strip" aria-live="polite"></div>
      </header>

      <div class="feed-wrap">
        <div class="feed" id="feed"></div>
        <button class="pill" id="jump" type="button" hidden>Jump to live</button>
      </div>

      <div class="empty" id="empty" hidden>
        <div class="card">
          <h2>Create a project</h2>
          <p>A project is a folder on disk. Meetings are saved in <code>&lt;folder&gt;/Steno/</code>, so they stay with the rest of your work.</p>
          <div class="card-actions">
            <button class="btn rec" id="empty-new" type="button">+ New project</button>
            <button class="btn" id="empty-add" type="button">Add existing folder</button>
          </div>
        </div>
      </div>
    </section>

    <!-- people view -->
    <section class="view" id="view-people" aria-label="People" hidden>
      <header class="top">
        <div class="top-row"><h1>People</h1></div>
        <div class="strip"><span class="lab">VOICE PROFILES · STORED ON THIS COMPUTER</span></div>
      </header>
      <div class="feed-wrap"><div class="feed" id="people"></div></div>
    </section>

    <!-- settings view -->
    <section class="view" id="view-settings" aria-label="Settings" hidden>
      <header class="top">
        <div class="top-row"><h1>Settings</h1></div>
        <div class="strip"><span class="lab">SAVED ON THIS COMPUTER</span></div>
      </header>
      <div class="feed-wrap"><div class="feed" id="settings"></div></div>
    </section>
  </main>
</div>

<div class="toasts" id="toasts" role="status"></div>
<dialog id="modal"></dialog>
<datalist id="people-names"></datalist>
</body>
</html>
