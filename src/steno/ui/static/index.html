<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Steno</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<div class="app">

  <aside class="side" id="side" aria-label="Projects">
    <div class="brand">
      <svg class="logo" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="7" width="2.4" height="6" rx="1.2"/><rect x="6.4" y="4" width="2.4" height="12" rx="1.2"/><rect x="10.8" y="2" width="2.4" height="16" rx="1.2"/><rect x="15.2" y="6" width="2.4" height="8" rx="1.2"/></svg>
      <span>Steno</span>
      <button class="icon-btn small side-hide" id="side-hide" type="button" aria-label="Hide sidebar" title="Hide sidebar (Ctrl+B)" data-icon="sidebar"></button>
      <button class="icon-btn side-close" id="side-close" type="button" aria-label="Close menu" data-icon="x"></button>
    </div>

    <div class="side-head">
      <span class="side-label">Projects</span>
      <button class="icon-btn small" id="btn-addmenu" type="button" aria-label="New project" title="New project" data-icon="plus"></button>
    </div>
    <nav class="plist" id="plist"></nav>
    <nav class="plist" id="inbox-slot"></nav>
    <nav class="plist" id="arch-slot"></nav>

    <div class="grow"></div>
    <nav class="plist">
      <button class="pitem" id="nav-people" type="button"><i class="picon" data-icon="people"></i><span class="pname">People</span><span class="pcount" id="people-count"></span></button>
      <button class="pitem" id="nav-settings" type="button"><i class="picon" data-icon="settings"></i><span class="pname">Settings</span></button>
    </nav>
    <div class="side-llm" id="side-llm" hidden></div>
    <div class="side-foot off" id="side-foot" hidden></div>
  </aside>
  <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize the sidebar (drag all the way left to hide it)" tabindex="0" title="Drag to resize · drag left to hide · double-click to hide/show (Ctrl+B)"></div>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <!-- project view -->
    <section class="view" id="view-project" aria-label="Meetings">
      <header class="top">
        <button class="icon-btn menu-btn" type="button" aria-label="Projects" data-icon="menu"></button>
        <h1 id="proj-name"></h1>
        <span class="jobchip" id="jobchip" hidden></span>
        <button class="icon-btn" id="btn-projmenu" type="button" aria-label="Project options" title="Project options" data-icon="more"></button>
      </header>

      <div class="feed-wrap">
        <div class="feed" id="feed"></div>
        <button class="pill" id="jump" type="button" hidden></button>
      </div>

      <div class="empty" id="empty" hidden>
        <div class="card">
          <svg class="logo big" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="7" width="2.4" height="6" rx="1.2"/><rect x="6.4" y="4" width="2.4" height="12" rx="1.2"/><rect x="10.8" y="2" width="2.4" height="16" rx="1.2"/><rect x="15.2" y="6" width="2.4" height="8" rx="1.2"/></svg>
          <h2>Create a project</h2>
          <p>A project groups your meetings. Add subfolders to it: each one is a folder on your computer where its meetings are saved.</p>
          <div class="card-actions">
            <button class="btn primary big" id="empty-new" type="button">New project</button>
          </div>
        </div>
      </div>

      <!-- recording dock -->
      <div class="dock" id="dock" data-state="idle">
        <div class="dock-idle">
          <button class="btn dock-type" id="rec-type" type="button" aria-haspopup="menu" aria-label="Subfolder" title="Subfolder: where the meeting is saved" hidden></button>
          <button class="btn dock-type dock-folder" id="rec-folder" type="button" aria-label="Record into an existing folder" hidden></button>
          <input class="text dock-title" id="rec-title" type="text" placeholder="Meeting title (optional)" maxlength="80" aria-label="Meeting title" autocomplete="off">
          <div class="dock-opts">
            <button class="btn keep-btn title-btn" id="btn-autotitle" type="button" aria-pressed="true"><i data-icon="heading"></i><span class="lbl">Auto title</span><span class="tog" aria-hidden="true"></span></button>
            <button class="icon-btn src-btn" id="btn-src" type="button" aria-label="Audio sources" title="Audio sources"></button>
            <button class="btn keep-btn" id="btn-keep" type="button" aria-pressed="false"><i data-icon="keep"></i><span class="lbl">Keep audio</span><span class="tog" aria-hidden="true"></span></button>
          </div>
          <button class="btn rec" id="btn-rec" type="button"><span class="rec-ico"></span><span id="btn-rec-label">Record</span></button>
        </div>
        <div class="dock-live">
          <span class="live-dot"></span>
          <span class="timer" id="timer">00:00</span>
          <span class="meters" id="meters"></span>
          <span class="live-status" id="live-status"></span>
          <span class="grow"></span>
          <button class="btn keep-btn title-btn" id="btn-autotitle-live" type="button" aria-pressed="true"><i data-icon="heading"></i><span class="lbl">Auto title</span><span class="tog" aria-hidden="true"></span></button>
          <button class="btn" id="btn-pause" type="button" title="Pause" aria-label="Pause"><i data-icon="pause"></i><span class="lbl">Pause</span></button>
          <button class="btn stop" id="btn-stop" type="button" title="Stop recording" aria-label="Stop recording"><i data-icon="stop"></i><span class="lbl">Stop</span></button>
        </div>
      </div>
    </section>

    <!-- people view -->
    <section class="view" id="view-people" aria-label="People" hidden>
      <header class="top">
        <button class="icon-btn menu-btn" type="button" aria-label="Projects" data-icon="menu"></button>
        <h1>People</h1>
      </header>
      <div class="feed-wrap"><div class="feed" id="people"></div></div>
    </section>

    <!-- settings view -->
    <section class="view" id="view-settings" aria-label="Settings" hidden>
      <header class="top">
        <button class="icon-btn menu-btn" type="button" aria-label="Projects" data-icon="menu"></button>
        <h1>Settings</h1>
        <button class="icon-btn" id="settings-close" type="button" aria-label="Close settings" title="Close settings (Esc)" data-icon="x"></button>
      </header>
      <div class="feed-wrap"><div class="feed" id="settings"></div></div>
    </section>
  </main>
</div>

<!-- window buttons: only with the desktop app's own frame (html.custom-frame) -->
<div class="winctl" id="winctl" role="group" aria-label="Window">
  <button class="wbtn" type="button" data-win="minimize" aria-label="Minimize" title="Minimize" data-icon="winMin"></button>
  <button class="wbtn" type="button" data-win="maximize" aria-label="Maximize" title="Maximize" id="win-max" data-icon="winMax"></button>
  <button class="wbtn close" type="button" data-win="close" aria-label="Close" title="Close" data-icon="winClose"></button>
</div>
<div class="toasts" id="toasts" role="status"></div>
<dialog id="modal"></dialog>
<datalist id="people-names"></datalist>
</body>
</html>
