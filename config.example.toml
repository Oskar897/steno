# Copy to config.toml (git-ignored) and adjust. No secrets belong here.
# Search order: <data dir>/config.toml (%USERPROFILE%\.steno), then the repo root.
# Every key is optional; the values below are the built-in defaults.

[audio]
sample_rate = 16000
capture_mic = true
capture_loopback = true      # system audio (Discord, Meet, Teams)
mic_speaker_label = "Me"     # fallback label, only used when [speakers] is disabled
loopback_speaker_label = "Remote"   # likewise

[asr]
backend = "faster-whisper"
model = "KBLab/kb-whisper-small"   # chosen from scripts/benchmark_asr.py results
compute_type = "int8"
language = "sv"                    # "sv", "en" or "auto"
cpu_threads = 6
beam_size = 1
# Whisper initial_prompt, passed to every faster-whisper call (live and finalize); "" = none.
# A natural Swedish meeting text that spells English terms in English nudges the model to
# keep them that way. Keep it generic. For English-only meetings set it to "".
initial_prompt = "Hej allihopa, välkomna till veckomötet. Vi började med vår thesis och sen fixade vi några bugs i pipelinen. Jag testade scriptet på servern och committade ändringen på GitHub. Efter lunch har vi en workshop, så ta med laptopen och en bra paper."

[vad]
threshold = 0.4              # lower = more speech kept (0.5 before the far-field tests)
min_silence_ms = 500
min_speech_ms = 250
max_segment_s = 15
# Lift quiet far-field audio (laptop mic across a room) before the VAD only; ASR and
# speaker recognition still get the original audio. Never amplifies more than
# auto_gain_max, so a loud mic is untouched. Helps when the VAD misses much of a quiet
# recording (far-field AMI: 22 % of the speech missed -> 13 % with threshold 0.4).
auto_gain = true
auto_gain_target = 0.05      # RMS that the 90th-percentile level of the last 30 s is lifted to
auto_gain_max = 8.0

[echo]
# Drop mic speech that overlaps loopback speech and is much quieter than it
# (the remote voice leaking from speakers into the mic).
enabled = true
ratio = 0.35

[speakers]
# Speaker recognition. Needs the 'speakers' extra (sherpa-onnx); the model
# (~28 MB) is downloaded to <data dir>\models on first use.
# All thresholds are cosine similarities and are UNCALIBRATED starting points:
# tune them on your own microphone and rooms (scripts/eval_diarization.py).
enabled = true
model = "3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx"
num_threads = 2
min_embed_s = 1.0            # shorter segments/windows inherit the previous speaker (low confidence)
accept_threshold = 0.55      # enrolled person: best score must reach this ...
margin = 0.05                # ... and beat the second-best person by this much
# A whole live cluster is matched to the enrolled people too (its centroid is far less noisy
# than a single 1.5 s window: the same voice scores 0.4-0.75 per window against its profile
# but 0.65-0.8 as a cluster, a different voice 0.45-0.5). A matching cluster is bound to the
# person for good and its earlier lines follow; 0 turns this off.
cluster_match_threshold = 0.6   # cluster centroid vs profile score
cluster_match_margin = 0.1      # ... and ahead of the second-best person by this much
cluster_match_s = 4.0           # a cluster is only matched after this much speech
cluster_match_pool = 0.75       # ... and must sound like that person's windows in this session

# Turns inside a segment: a VAD segment is cut into overlapping windows, each window is
# labelled on its own, and the segment is split where the speaker changes. This is what
# catches a short "yes" from a second person inside a long monologue.
window_s = 1.5               # embedding window; 0 = one embedding per segment (old behaviour)
window_hop_s = 0.75
smooth_windows = 3           # median filter over the window labels (odd; 1 = off)
min_turn_s = 0.5             # shorter turns are absorbed by the longer neighbour
snap_boundaries = false      # move each cut to the quietest point within 0.4 s (no DER gain on AMI)

# Live session clusters ("Speaker 1", ...), with an anti-fragmentation gate.
cluster_threshold = 0.5      # window joins a cluster and moves its centroid at/above this
assign_floor = 0.4           # between floor and threshold: takes the label, centroid stays
                             # below the floor a window opens a new, tentative speaker
merge_threshold = 0.7        # merge two clusters whose centroids reach this
confirm_s = 3.5              # a new speaker needs this much speech ...
confirm_segments = 2         # ... from this many different segments, else it is merged
                             # into the nearest real speaker (latest when the session ends)
tentative_ttl = 8            # ... or when it was not heard for this many segments
max_speakers = 10

# `steno refine`: spectral clustering of all windows, speaker count from the eigengap.
refine_threshold = 0.4       # agglomerative stop similarity (used below refine_min_spectral)
refine_pval = 0.012          # p-pruning: keep this fraction of strongest neighbours per row ...
refine_min_pnum = 6          # ... but at least this many
refine_min_spectral = 40     # fewer windows than this: agglomerative clustering instead
refine_max_speakers = 10
refine_minor_windows = 4     # clusters this small are reassigned to the nearest large one

# `steno enroll`: windows over the recording; outliers (cough, noise) are dropped.
enroll_window_s = 2.5
enroll_hop_s = 1.0
enroll_outlier_sigma = 2.0

[profiles]
# A profile only changes for a person you enrolled or named. With auto_update a finished
# session adds up to auto_update_max new voice samples (diverse, never near-duplicates; the
# profile keeps at most 30) of every enrolled person it recognised, so the profile follows
# your microphone and room. Encrypted like the rest of the profile; false = only `steno enroll`
# and `steno name` change profiles.
auto_update = true
auto_update_min_s = 15.0        # speech recognised as the person needed in the session
auto_update_min_score = 0.6     # the session's voice must match the profile this well
auto_update_max = 5
auto_update_dup = 0.93          # skip samples this similar (cosine) to one already stored

[refine]
# Rolling refinement while recording. The live draft (one utterance at a time, [asr] model)
# appears after a few seconds; in the background a second pass transcribes every ~25 s of
# accumulated speech again as long-form audio (whole sentences, 30 s chunks, own Silero VAD)
# and replaces the draft text of the covered lines (revisions.jsonl; speakers stay attached).
# Stopping then only refines the last window, so the finished transcript is ready in seconds.
enabled = true
model = "KBLab/kb-whisper-medium"  # ~1.5 GB download on first use; ~0.65 s per second of speech;
                             # keeps English sentences inside Swedish speech (turbo dropped them)
fallback_model = "KBLab/kb-whisper-small"  # used while far behind (back when caught up) and
                             # for the stop tail below; "" = none
stop_budget_s = 25.0         # at stop: the rest goes to fallback_model when `model` would take
                             # longer than this (estimated from its measured speed); 0 = never
detect_english = true        # [asr] language "sv": English 30 s chunks stay English instead of
                             # being translated (no extra cost); lone English sentences inside
                             # Swedish speech are still transcribed as Swedish
window_speech_s = 25.0       # refine a stream once this much unrefined speech has accumulated
max_wait_s = 60.0            # ... or once its oldest unrefined line is this old (stream time)
pad_s = 0.5                  # audio context before the first / after the last line of a window
threads = 4                  # CPU threads of the refine model (the live model: [asr] cpu_threads)
beam_size = 1
batch_size = 2               # 30 s chunks decoded together
buffer_s = 900.0             # audio kept in memory per stream (16 bit, ~2 MB/min); older is dropped
max_backlog_windows = 3      # more unrefined speech than this many windows: use fallback_model ...
skip_after_windows = 6       # ... and beyond this many the oldest windows are skipped (draft stays)
# Speakers during the meeting: pyannote segmentation-3.0 + CAM++ on every 10 s window that held
# live speech (diar.bin, encrypted), so that `steno finalize` has the accurate speaker labels
# ready when you stop. Needs [speakers] enabled; independent of `enabled` above.
diarize = true
diarize_threads = 2          # segmentation and speaker-embedding threads of that worker

[post]
# `steno finalize`: the pass after a meeting; writes final.jsonl / final.md next to the live
# transcript. By default it takes seconds and needs no kept audio.
auto = false                 # true: run it when `steno record` stops (Ctrl+C skips it)
# Text:
#   "refined"   the text the rolling refine worker wrote during the meeting ([refine]); no new
#               ASR. A session without revisions (older, or [refine] off) falls back to
#               "longform" when it has kept audio, else keeps the draft.
#   "longform"  each kept stream once as a whole with asr_model (own Silero VAD, batched 30 s
#               windows, [asr] language and initial_prompt); the words replace the live text
#               and go to the final speaker turns. Mic words that are only the remote side
#               leaking into the mic stay dropped (the live echo decisions are respected).
#   "selective" only live lines with low confidence, one clip at a time (--full-asr: all).
#               Per-clip decoding pads every clip to 30 s, so use a smaller asr_model here,
#               e.g. "KBLab/kb-whisper-medium".
#   "off"       keep the live draft words.
asr_mode = "refined"
# Speakers:
#   "fast"      spectral clustering of the live window embeddings (windows.bin): seconds, no
#               audio needed, accuracy of `steno refine` (AMI far-field: DER ~30 %).
#   "thorough"  pyannote segmentation-3.0 + CAM++ over the kept audio (AMI: DER ~18 %,
#               ~0.1 x the audio length). `steno finalize --thorough`.
diarization = "fast"
asr_model = "KBLab/kb-whisper-medium"  # ~1.5 GB; 172 s Swedish+English test, whole file: WER 6 % vs 21 % (large-v3-turbo) and 22 % (kb-whisper-small)
asr_beam_size = 5            # selective mode
longform_beam_size = 1
longform_batch_size = 4      # 30 s windows decoded together
asr_min_logprob = -0.7       # live lines below this average log-probability are redone
asr_max_compression = 2.4    # ... and so are repetitive lines (hallucination loops)
threads = 4
seg_step_s = 2.5             # one 10 s segmentation window every 2.5 s (5 s: faster, worse)
seg_min_clean_s = 1.0        # solo speech a local speaker needs to take part in clustering
minor_points = 4             # speaker clusters this small are folded into the nearest one
split_cos = 0.78             # clustering found one speaker: still accept a 2-way split when the two
                             # centroids' cosine is at most this (0 = never) ...
split_min_s = 20.0           # ... and the smaller cluster has this many seconds of solo speech
merge_gap_s = 1.0            # same-speaker lines closer than this are joined

[llm]
# `steno summary` / `steno todo` / `steno clean` / `steno finalize --llm-fix` call the Claude Code CLI
# (`claude -p`, your own login, no API key here). Only text is sent, never audio.
command = "claude"
model = "haiku"              # alias or full model name (clean-up, --llm-fix, auto title)
summary_model = "sonnet"     # summary and to-do (whole meeting, judgement); "" = same as model
effort = "medium"             # low, medium, high, xhigh, max; "" = CLI default
language = "sv"              # output language; "auto" = the language of the meeting
timeout_s = 600
fix_max_edit = 0.3           # --llm-fix and `steno clean`: largest accepted correction (share of the line)
todo_min_confidence = 0.5    # to-do items below this confidence are dropped
